# dsh-next-reply bundle patch: mounts the plugin into a profile's Host
# composition. The Host half registers one system-prompt section (the marker
# format the model must emit) plus two same-origin routes (preference and
# diagnostics); the browser half renders the chips and sends them through the
# composer's own input actions.
#
# Install: `dsh plugin --profile <name> add <path-or-package>`.
# Disable: the row's switch on Settings -> Plugins, which removes both halves.
#
# Renamed at 0.7.0 from dsh-next-reply-chips. The loader entry id and `name`
# must move together with package.json `name`, or nothing mounts.
- insert:
    - id: next-reply
      # Node-resolvable package name — must stay in sync with package.json `name`.
      name: 'dsh-next-reply'
      config: {}
